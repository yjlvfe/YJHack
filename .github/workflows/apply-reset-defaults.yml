name: Apply balanced reset defaults

on:
  push:
    branches: ["fix/reset-defaults-20260730"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/reset-defaults-20260730
          fetch-depth: 0

      - name: Apply source defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, found {actual}")
              p.write_text(text.replace(old, new, count))

          # AutoLeft: reset to disabled, weapon-gated, moderate cadence.
          path = "Dev/src/main/java/com/masteryj/autoleft/AutoLeftClient.java"
          replace(path, "private static final int DEFAULT_MIN_CPS = 30;", "private static final int DEFAULT_MIN_CPS = 8;")
          replace(path, "private static final int DEFAULT_MAX_CPS = 40;", "private static final int DEFAULT_MAX_CPS = 10;")
          replace(path, "public static boolean enabled = true;", "public static boolean enabled = false;")
          replace(path, "public static boolean weaponCheck = false;", "public static boolean weaponCheck = true;")
          replace(path, "public boolean enabled = true;", "public boolean enabled = false;")
          replace(path, "public boolean weaponCheck = false;", "public boolean weaponCheck = true;")

          # AutoRight: reset to disabled; block mode stays available when explicitly enabled.
          path = "Dev/src/main/java/com/masteryj/autoright/AutoRightClient.java"
          replace(path, "private static final int DEFAULT_MIN_CPS = 30;", "private static final int DEFAULT_MIN_CPS = 8;")
          replace(path, "private static final int DEFAULT_MAX_CPS = 40;", "private static final int DEFAULT_MAX_CPS = 10;")
          replace(path, "public static boolean enabled = true;", "public static boolean enabled = false;")
          replace(path, "public boolean enabled = true;", "public boolean enabled = false;")

          # NinjaBridge: never enable or switch slots automatically after Reset.
          path = "Dev/src/main/java/com/masteryj/ninjabridge/NinjaBridgeClient.java"
          replace(path, "private static final int CURRENT_CONFIG_VERSION = 7;", "private static final int CURRENT_CONFIG_VERSION = 8;")
          replace(path, "public static boolean enabled = true;", "public static boolean enabled = false;")
          replace(path, "public static boolean autoSwitch = true;", "public static boolean autoSwitch = false;")
          replace(path, "public boolean enabled = true;", "public boolean enabled = false;")
          replace(path, "public boolean autoSwitch = true;", "public boolean autoSwitch = false;")
          replace(path, "if (!autoSwitchPresent) autoSwitch = true;", "if (!autoSwitchPresent) autoSwitch = false;")

          # AimAssist: disabled by default with balanced, smooth values when enabled manually.
          path = "Dev/src/main/java/com/masteryj/aimassist/AimAssistClient.java"
          replace(path, "private static final int CURRENT_CONFIG_VERSION = 6;", "private static final int CURRENT_CONFIG_VERSION = 7;")
          replace(path, "public static float speed = 0.24F;", "public static float speed = 0.28F;")
          replace(path, "public static float smoothness = 0.35F;", "public static float smoothness = 0.45F;")
          replace(path, "public float speed = 0.24F;", "public float speed = 0.28F;")
          replace(path, "public float smoothness = 0.35F;", "public float smoothness = 0.45F;")
          replace(path, "speed = sanitize(speed, 0.24F, 0.01F, 1.0F);", "speed = sanitize(speed, 0.28F, 0.01F, 1.0F);")
          replace(path, "smoothness = sanitize(smoothness, 0.35F, 0.0F, 1.0F);", "smoothness = sanitize(smoothness, 0.45F, 0.0F, 1.0F);")

          # Tracker: disabled after Reset, useful team filter and a moderate range.
          path = "Dev/src/main/java/com/masteryj/tracker/TrackerClient.java"
          replace(path, "private static final int CURRENT_CONFIG_VERSION = 6;", "private static final int CURRENT_CONFIG_VERSION = 7;")
          replace(path, "public static boolean enabled = true;", "public static boolean enabled = false;")
          replace(path, "public static double range = 96.0D;", "public static double range = 48.0D;")
          replace(path, "public static int hudOffsetX;", "public static int hudOffsetX = 8;")
          replace(path, "public boolean enabled = true;", "public boolean enabled = false;")
          replace(path, "public double range = 96.0D;", "public double range = 48.0D;")
          replace(path, "public int hudOffsetX;", "public int hudOffsetX = 8;")
          replace(path, "if (Double.isNaN(range) || Double.isInfinite(range)) range = 96.0D;", "if (Double.isNaN(range) || Double.isInfinite(range)) range = 48.0D;")

          # Update the legacy migration expectation to the new conservative fallback.
          path = "Dev/src/test/java/com/masteryj/ninjabridge/NinjaBridgeMigrationTest.java"
          replace(path, "import static org.junit.jupiter.api.Assertions.assertTrue;\n", "")
          replace(path, "void missingLegacyFieldReceivesSafeDefault()", "void missingLegacyFieldDefaultsToNoAutomaticSlotSwitch()")
          replace(path, "assertTrue(config.autoSwitch);", "assertFalse(config.autoSwitch);")
          PY

          mkdir -p Dev/src/test/java/com/masteryj/config
          cat > Dev/src/test/java/com/masteryj/config/ConfigDefaultsTest.java <<'EOF'
          package com.masteryj.config;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import com.masteryj.aimassist.AimAssistClient;
          import com.masteryj.autoleft.AutoLeftClient;
          import com.masteryj.autoright.AutoRightClient;
          import com.masteryj.ninjabridge.NinjaBridgeClient;
          import com.masteryj.tracker.TrackerClient;
          import org.junit.jupiter.api.Test;

          class ConfigDefaultsTest {

              @Test
              void resetDefaultsAreDisabledAndBalanced() {
                  AutoLeftClient.Config left = new AutoLeftClient.Config();
                  assertFalse(left.enabled);
                  assertTrue(left.weaponCheck);
                  assertEquals(8, left.minCps);
                  assertEquals(10, left.maxCps);

                  AutoRightClient.Config right = new AutoRightClient.Config();
                  assertFalse(right.enabled);
                  assertTrue(right.blockMode);
                  assertEquals(8, right.minCps);
                  assertEquals(10, right.maxCps);

                  NinjaBridgeClient.Config bridge = new NinjaBridgeClient.Config();
                  assertFalse(bridge.enabled);
                  assertFalse(bridge.autoSwitch);

                  AimAssistClient.Config aim = new AimAssistClient.Config();
                  assertFalse(aim.enabled);
                  assertEquals(0.28F, aim.speed, 0.0001F);
                  assertEquals(0.45F, aim.smoothness, 0.0001F);
                  assertEquals(70.0F, aim.fov, 0.0001F);

                  TrackerClient.Config tracker = new TrackerClient.Config();
                  assertFalse(tracker.enabled);
                  assertTrue(tracker.ignoreOwnTeam);
                  assertEquals(48.0D, tracker.range, 0.0001D);
                  assertEquals(8, tracker.hudOffsetX);
                  assertEquals(8, tracker.hudY);
              }
          }
          EOF

          rm .github/workflows/apply-reset-defaults.yml

      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add balanced reset defaults"
          git push origin HEAD:fix/reset-defaults-20260730
