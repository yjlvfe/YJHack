name: YJHack CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Clean, test and build
        working-directory: Dev
        run: gradle --no-daemon clean test build --warning-mode all

      - name: Upload release jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YJHack-1.21.5
          path: YJHack-1.21.5.jar
          if-no-files-found: error

  publish_release:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/publish-v1.0.6-autoleft-hold-fix-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Clean, test and build release
        working-directory: Dev
        run: gradle --no-daemon clean test build --warning-mode all

      - name: Generate SHA-256 checksum
        run: sha256sum YJHack-1.21.5.jar > YJHack-1.21.5.jar.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.6-autoleft-hold-fix-20260730
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              YJHack-1.21.5.jar \
              YJHack-1.21.5.jar.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              YJHack-1.21.5.jar \
              YJHack-1.21.5.jar.sha256 \
              --target "$RELEASE_TARGET" \
              --title "YJHack 1.21.5 — AutoLeft Hold Stability" \
              --notes "Verified build for Minecraft 1.21.5. Stabilizes normal-range held AutoLeft combat clicks: transient weapon or crosshair changes no longer force a manual mouse release, follow-up held attacks run only while an entity is actually under the crosshair, and shared vanilla action dispatch now flushes after Minecraft input handling to avoid swallowed long holds. Attack reach is unchanged and AimAssist remains at the existing four-block visual lock. Existing global fairness, no-backlog behavior, release gates, Reset defaults, AutoRight protections, and previous hardening remain included. Built with Java 21 and Gradle 8.14.4 after the complete automated test suite."
          fi
