name: YJHack CI

on:
  push:
    branches: [main, "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      jar_name: ${{ steps.meta.outputs.jar_name }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' Dev/gradle.properties)"
          test -n "$version"
          jar_name="YJHack-${version}-mc1.21.5.jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar_name=$jar_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=YJHack-${version}-mc1.21.5" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Clean, test and build
        working-directory: Dev
        run: gradle --no-daemon clean test build --warning-mode all

      - name: Verify final jar exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ steps.meta.outputs.jar_name }}"
          test -s "${{ steps.meta.outputs.jar_name }}"

      - name: Upload verified jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.jar_name }}
          if-no-files-found: error

  publish_release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, 'release: YJHack 1.3.0'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified jar
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum "${{ needs.build.outputs.jar_name }}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${RELEASE_TARGET}" >/dev/null
          fi

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "release-assets/${JAR_NAME}" \
              release-assets/SHA256SUMS.txt \
              --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" \
              "release-assets/${JAR_NAME}" \
              release-assets/SHA256SUMS.txt \
              --repo "$GH_REPO" \
              --target "$RELEASE_TARGET" \
              --title "YJHack ${tag}" \
              --notes-file .github/RELEASE_v1.3.0.md \
              --latest
          fi

      - name: Verify published assets and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-verify
          gh release download "v${VERSION}" \
            --repo "$GH_REPO" \
            --pattern "$JAR_NAME" \
            --pattern SHA256SUMS.txt \
            --dir release-verify \
            --clobber
          cd release-verify
          sha256sum --check SHA256SUMS.txt
