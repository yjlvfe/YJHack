name: YJHack CI

on:
  push:
    branches: [main, "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Clean, test and build
        working-directory: Dev
        run: gradle --no-daemon clean test build --warning-mode all

      - name: Upload verified jar
        uses: actions/upload-artifact@v7
        with:
          name: YJHack-1.21.5
          path: YJHack-1.21.5.jar
          if-no-files-found: error

  publish_release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.head_ref == 'release/v1.2.2-long-hold')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified jar
        uses: actions/download-artifact@v7
        with:
          name: YJHack-1.21.5
          path: .

      - name: Generate SHA-256 checksum
        run: sha256sum YJHack-1.21.5.jar > YJHack-1.21.5.jar.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.2' }}
          RELEASE_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              YJHack-1.21.5.jar \
              YJHack-1.21.5.jar.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              YJHack-1.21.5.jar \
              YJHack-1.21.5.jar.sha256 \
              --target "$RELEASE_TARGET" \
              --title "YJHack v1.2.2 — Long Hold Repair" \
              --notes "Verified Minecraft 1.21.5 release. Restores reliable long-held AutoLeft and AutoRight input, preserves vanilla mining and charge/use items, retains single-press and slot-change safety, keeps remapped controls working, and leaves NinjaBridge unchanged. Built with Java 21 and Gradle 8.14.4 after a clean test build."
          fi

      - name: Delete temporary release branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
