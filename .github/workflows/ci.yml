name: YJHack CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Clean, test and build
        working-directory: Dev
        run: gradle --no-daemon clean test build --warning-mode all

      - name: Upload release jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YJHack-1.21.5
          path: YJHack-1.21.5.jar
          if-no-files-found: error
