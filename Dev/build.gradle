plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// ============================================================
// Clean, fully source-based Fabric build.
// All six modules (modgui, tracker, aimassist, autoleft,
// autoright, ninjabridge) are compiled from src/main/java.
// The previous bin/main pre-compiled-blob injection and the
// extractGoodModClasses / mergeGoodModClasses hacks were
// removed during the 2026-07-23 repair — they were the root
// cause of the "can't edit settings" and mismatched-class
// crashes. See report/comprehensive-repair-report.html.
// ============================================================

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, loader_version: project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// Copy the remapped jar next to the project root for easy testing.
tasks.register('copyJar', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into file(project.hasProperty('outputJarDir') ? project.property('outputJarDir') : file('..'))
    rename { 'YJHack-1.21.5.jar' }
}

build.finalizedBy copyJar
clean.doLast {
    delete file('/home/masteryj/Desktop/Mod Maker/YJHack-1.21.5/YJHack-1.21.5.jar')
}
