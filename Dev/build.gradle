plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Headless unit tests: fabric-loader-junit bundles JUnit 5 and sets up the
    // Minecraft test classpath so production classes (e.g. RightClickPolicy) load.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// Fully source-based Fabric build: all six client modules compile from
// src/main/java. There is no pre-compiled bin/main blob injection — do not
// reintroduce one (it was the cause of the earlier mismatched-class crashes).

processResources {
    // Capture at configuration time so the filesMatching closure (which runs at
    // execution time) never dereferences Task.project (Gradle 10 / config-cache).
    def modVersion = project.version
    def loaderVersion = project.loader_version
    inputs.property 'version', modVersion
    inputs.property 'loader_version', loaderVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion, loader_version: loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// Copy the remapped jar next to the project root for easy testing.
tasks.register('copyJar', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into file(project.hasProperty('outputJarDir') ? project.property('outputJarDir') : file('..'))
    rename { 'YJHack-1.21.5.jar' }
}

build.finalizedBy copyJar

// Resolve the path at configuration time and delete via java.io.File at execution,
// so nothing calls Task.project during task execution (configuration-cache friendly).
def rootConvenienceJar = file('../YJHack-1.21.5.jar')
clean.doLast {
    // Remove the convenience copy copyJar drops next to the project root.
    rootConvenienceJar.delete()
}
