plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

processResources {
    def modVersion = project.version
    def loaderVersion = project.loader_version
    inputs.property 'version', modVersion
    inputs.property 'loader_version', loaderVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion, loader_version: loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// The convenience release copy is produced only after compilation and all checks succeed.
tasks.register('copyJar', Copy) {
    dependsOn check, remapJar
    from remapJar.archiveFile
    into file(project.hasProperty('outputJarDir') ? project.property('outputJarDir') : file('..'))
    rename { 'YJHack-1.21.5.jar' }
}

tasks.named('build') {
    dependsOn copyJar
}

// Remove only the generated convenience copy. The frozen reference build stays outside the repo.
def rootConvenienceJar = file('../YJHack-1.21.5.jar')
clean.doLast {
    rootConvenienceJar.delete()
}
