plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

processResources {
    def modVersion = project.version
    def loaderVersion = project.loader_version
    inputs.property 'version', modVersion
    inputs.property 'loader_version', loaderVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion, loader_version: loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// Use a regular task with an exact output file. A Copy task pointed at the repository root makes
// Gradle treat the whole checkout as its output directory, which conflicts with sourcesJar.
def rootConvenienceJar = file('../YJHack-1.21.5.jar')
tasks.register('copyJar') {
    dependsOn check, remapJar
    inputs.file(remapJar.archiveFile)
    outputs.file(rootConvenienceJar)
    doLast {
        java.nio.file.Files.copy(
                remapJar.archiveFile.get().asFile.toPath(),
                rootConvenienceJar.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.named('build') {
    dependsOn copyJar
}

clean.doLast {
    rootConvenienceJar.delete()
}
